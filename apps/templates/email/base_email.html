<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}TrainingHub{% endblock %}</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #f5f6fa;
      font-family:
        -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    "
  >
    <table
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color: #f5f6fa; padding: 40px 16px"
    >
      <tr>
        <td align="center">
          <table
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="
              max-width: 480px;
              background-color: #ffffff;
              border: 1px solid #e4e7ed;
              border-radius: 12px;
              overflow: hidden;
            "
          >
            <tr>
              <td
                style="
                  padding: 24px 28px 20px 28px;
                  border-bottom: 1px solid #e4e7ed;
                "
              >
                <table cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="vertical-align: middle">
                      <table cellpadding="0" cellspacing="0" border="0">
                        <tr>
                          <td
                            style="
                              width: 28px;
                              height: 28px;
                              background-color: #0f1b35;
                              border-radius: 6px;
                              text-align: center;
                              vertical-align: middle;
                              font-family: Georgia, serif;
                              font-weight: 800;
                              font-size: 14px;
                              color: #ffffff;
                              line-height: 28px;
                            "
                          >
                            T
                          </td>
                          <td
                            style="
                              padding-left: 8px;
                              font-size: 15px;
                              font-weight: 700;
                              color: #00a9d5;
                              vertical-align: middle;
                              white-space: nowrap;
                            "
                          >
                            Training
                            <span style="color: #00a9d5; font-weight: 500"
                              >Hub</span
                            >
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding: 32px 28px 28px 28px">
                <table
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="margin-bottom: 20px"
                >
                  <tr>
                    <td
                      style="
                        width: 52px;
                        height: 52px;
                        background-color: #ebebff;
                        border-radius: 12px;
                        text-align: center;
                        vertical-align: middle;
                      "
                    >
                      <span style="font-size: 24px; line-height: 52px"
                        >{% block icon %}{% endblock %}</span
                      >
                    </td>
                  </tr>
                </table>
                <p
                  style="
                    margin: 0 0 8px 0;
                    font-size: 22px;
                    font-weight: 700;
                    color: #0f1b35;
                    letter-spacing: -0.02em;
                  "
                >
                  {% block heading %}{% endblock %}
                </p>
                {% block content %}{% endblock %} {% block extra %}{% endblock %}
                <table cellpadding="0" cellspacing="0" border="0" width="100%">
                  <tr>
                    <td
                      style="border-top: 1px solid #e4e7ed; padding-top: 24px"
                    >
                      <p
                        style="
                          margin: 0;
                          font-size: 13px;
                          color: #8891a5;
                          line-height: 1.6;
                        "
                      >
                        This is an automated message from
                        <strong style="color: #5a6478">TrainingHub</strong>.
                        Please do not reply to this email.
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td
                style="
                  padding: 16px 28px;
                  background-color: #f5f6fa;
                  border-top: 1px solid #e4e7ed;
                  text-align: center;
                "
              >
                <p style="margin: 0; font-size: 12px; color: #8891a5">
                  &copy; {% now "Y" %} TrainingHub - Powered by Merojob
                  since 2009
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
